<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; img-src data:">
<title>MultiGridView Alerts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
  :root{--bg:#0c1018;--panel:#131a26;--raise:#172031;--line:#222c3d;--line2:#2a3549;--ink:#e3e8f2;--muted:#8d98ad;--accent:#4f7dff;--accent2:#7aa2ff;--live:#ff4d6a;--off:#4a5468;color-scheme:dark}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Figtree,'Segoe UI',system-ui,sans-serif}
  main{padding:18px;display:flex;flex-direction:column;gap:14px;max-width:640px;margin:0 auto}
  header{display:flex;align-items:center;gap:10px}
  header h1{margin:0;font:700 17px Sora,'Segoe UI',sans-serif}
  header i{width:12px;height:12px;border-radius:3px;background:var(--accent);display:block}
  #summary{margin-left:auto;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
  #summary b{color:var(--ink)}
  section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
  h2{margin:0;font:700 10px Sora,'Segoe UI',sans-serif;letter-spacing:.16em;color:var(--accent2)}
  textarea{box-sizing:border-box;width:100%;min-height:90px;resize:vertical;background:var(--bg);color:var(--ink);border:1px solid var(--line2);border-radius:10px;padding:9px 11px;font:13px/1.5 Figtree,'Segoe UI',sans-serif;outline:none}
  textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,125,255,.25)}
  .masked textarea{-webkit-text-security:disc;color:var(--muted)}
  .hint{margin:0;color:var(--muted);font-size:12px}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px}
  @media (max-width:480px){.grid2{grid-template-columns:1fr}}
  label.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer}
  label.sw input{appearance:none;width:36px;height:20px;border-radius:10px;background:var(--line2);position:relative;cursor:pointer;flex:none;margin:0}
  label.sw input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:left .15s}
  label.sw input:checked{background:var(--accent)} label.sw input:checked::after{left:18px;background:#fff}
  label.sw input:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
  select{background:var(--raise);color:var(--ink);border:1px solid var(--line2);border-radius:8px;padding:5px 8px;font:inherit}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  button{font:600 13px Figtree,'Segoe UI',sans-serif;color:var(--ink);background:var(--raise);border:1px solid var(--line2);border-radius:10px;padding:8px 14px;cursor:pointer}
  button:hover{border-color:var(--accent2)} button:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.on{background:#1d2b4d;border-color:var(--accent);color:#cfe0ff}
  #saved{color:var(--accent2);font-size:12px}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  td{padding:7px 4px;border-top:1px solid var(--line)}
  td.st{width:110px} td.t{width:120px;text-align:right;color:var(--muted);font-size:12px}
  .who{display:flex;align-items:center;gap:9px;min-height:30px}
  .who img{width:30px;height:30px;border-radius:7px;object-fit:cover;border:1px solid var(--line2);flex:none}
  .who button{margin-left:auto;padding:4px 10px;font-size:12px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--off);margin-right:7px}
  .live .dot{background:var(--live);box-shadow:0 0 0 3px rgba(255,77,106,.2)}
  .live .lbl{color:#ffb3c0;font-weight:600}
  .empty{color:var(--muted);font-size:13px;padding:6px 0}
  footer{color:var(--muted);font-size:12px;text-align:center}
</style>
</head>
<body>
<main>
  <header><i></i><h1>MultiGridView Alerts</h1><span id="summary"></span></header>

  <section>
    <h2>BROADCASTERS TO WATCH FOR</h2>
    <div id="listwrap"><label for="users" class="hint" style="position:absolute;left:-9999px">Broadcasters</label><textarea id="users" spellcheck="false" placeholder="username1, username2, @username3"></textarea></div>
    <p class="hint">Separate with commas, spaces or new lines. You get one alert each time someone goes from offline to live.</p>
  </section>

  <section>
    <h2>ALERTS</h2>
    <div class="grid2">
      <label class="sw">Hide names in alerts<input type="checkbox" id="hideNames"></label>
      <label class="sw">Windows notification<input type="checkbox" id="toast"></label>
      <label class="sw">Sound<input type="checkbox" id="sound"></label>
      <label class="sw">Start with Windows<input type="checkbox" id="startWithWindows"></label>
      <label class="sw" title="The pop-up plays a small muted preview of the stream while it's on screen. Uses some data and briefly counts as a viewer.">Live preview in pop-ups<input type="checkbox" id="livePreview"></label>
    </div>
    <div class="row"><label for="minutes">Check every</label>
      <select id="minutes"><option value="1">1 minute</option><option value="2">2 minutes</option><option value="5">5 minutes</option><option value="10">10 minutes</option><option value="15">15 minutes</option></select>
    </div>
    <div class="row"><button class="primary" id="save">Save and check now</button><button id="pause"></button><button id="grid">Open MultiGridView</button><span id="saved" role="status" aria-live="polite"></span></div>
  </section>

  <section>
    <h2>STATUS</h2>
    <table><tbody id="rows"></tbody></table>
    <p class="hint" id="next"></p>
  </section>

  <footer>Closing this window keeps alerts running in the tray. Right-click the tray icon to pause or quit.</footer>
</main>
<script>
  const $ = id => document.getElementById(id);
  let S = null, dirty = false;
  const ago = t => { if (!t) return 'not checked yet'; const s = Math.round((Date.now() - t) / 1000); return s < 60 ? 'just now' : Math.round(s / 60) + ' min ago'; };
  function render(s) {
    S = s;
    if (!dirty) {
      $('users').value = s.cfg.users.join(', ');
      $('hideNames').checked = s.cfg.hideNames; $('toast').checked = s.cfg.toast; $('sound').checked = s.cfg.sound;
      $('startWithWindows').checked = s.startWithWindows; $('livePreview').checked = s.cfg.livePreview !== false; $('minutes').value = String(s.cfg.minutes);
    }
    $('listwrap').classList.toggle('masked', $('hideNames').checked);
    const live = s.rows.filter(r => r.live).length;
    $('summary').innerHTML = s.cfg.paused ? 'Paused' : `<b>${live}</b> of ${s.rows.length} live`;
    $('pause').textContent = s.cfg.paused ? 'Resume alerts' : 'Pause alerts';
    $('pause').classList.toggle('on', s.cfg.paused);
    const tb = $('rows'); tb.textContent = '';
    if (!s.rows.length) { const tr = tb.insertRow(); const td = tr.insertCell(); td.colSpan = 3; td.className = 'empty'; td.textContent = 'No broadcasters yet. Add some above and click Save and check now.'; }
    for (const r of s.rows) {
      const tr = tb.insertRow(); if (r.live) tr.className = 'live';
      const a = tr.insertCell().appendChild(document.createElement('div')); a.className = 'who';
      if (r.live && r.thumb && /^data:image\//.test(r.thumb)) { const im = document.createElement('img'); im.alt = ''; im.src = r.thumb; a.appendChild(im); }
      a.appendChild(document.createTextNode(r.label));
      if (r.live) { const ob = document.createElement('button'); ob.textContent = 'Open'; ob.title = 'Add to MultiGridView'; ob.onclick = () => window.mgv.openGrid(r.user); a.appendChild(ob); }
      const b = tr.insertCell(); b.className = 'st'; b.innerHTML = '<span class="dot"></span><span class="lbl"></span>';
      b.querySelector('.lbl').textContent = r.live === true ? 'Live' : r.live === false ? 'Offline' : (s.running ? 'Checking…' : 'Unknown');
      const c = tr.insertCell(); c.className = 't'; c.textContent = ago(r.checked);
    }
    const mins = Math.max(0, Math.round((s.nextAt - Date.now()) / 60000));
    $('next').textContent = !s.ready ? 'Connecting to Tango…' : s.running ? 'Checking now…' : s.cfg.paused ? 'Alerts are paused.' : `Next check in about ${mins < 1 ? 'a minute' : mins + ' min'}.`;
  }
  ['users', 'hideNames', 'toast', 'sound', 'startWithWindows', 'livePreview', 'minutes'].forEach(id => $(id).addEventListener('input', () => { dirty = true; $('listwrap').classList.toggle('masked', $('hideNames').checked); }));
  $('save').onclick = async () => {
    const users = $('users').value.split(/[\s,;]+/).filter(Boolean);
    dirty = false;
    render(await window.mgv.save({ users, hideNames: $('hideNames').checked, toast: $('toast').checked, sound: $('sound').checked, startWithWindows: $('startWithWindows').checked, livePreview: $('livePreview').checked, minutes: +$('minutes').value }));
    $('saved').textContent = 'Saved. Checking now.'; setTimeout(() => $('saved').textContent = '', 3000);
  };
  $('pause').onclick = async () => render(await window.mgv.pause(!S.cfg.paused));
  $('grid').onclick = () => window.mgv.openGrid();
  window.mgv.onState(render);
  window.mgv.get().then(render);
  setInterval(() => S && render(S), 20000);
</script>
</body>
</html>
